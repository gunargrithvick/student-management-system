<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="topbar__title">Student Management</h1>
      <div class="topbar__user">
        <span id="userInfo" class="user-info"></span>
        <button id="logoutBtn" class="btn btn--ghost" type="button">Log out</button>
      </div>
    </header>

    <nav id="mainNav" class="mainnav" aria-label="Sections"></nav>

    <main id="view" class="view" aria-live="polite"></main>

    <!-- Toast notifications: announced to screen readers via aria-live. -->
    <div id="toasts" class="toasts" aria-live="assertive" aria-atomic="true"></div>

    <!-- Modal host for create/edit forms. -->
    <div id="modalRoot" class="modal-root" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
